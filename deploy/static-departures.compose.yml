services:
  static-departures-api:
    build:
      context: ..
      dockerfile: services/static-departures.Dockerfile
    container_name: ${STATIC_DEPARTURES_CONTAINER_NAME:-static-departures-api}
    environment:
      DEPARTURES_DATABASE: ${DEPARTURES_DATABASE:-/data/current-release/departures.sqlite}
      STATIC_DATA_ROOT: ${STATIC_DATA_ROOT:-/data/current-release/stop-data}
      PORT: "8080"
    volumes:
      - /srv/haltewecker/data:/data:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - haltewecker

networks:
  haltewecker:
    external: true
