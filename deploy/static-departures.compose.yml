services:
  static-departures-api:
    env_file:
      - /srv/haltewecker/secrets/uk/.env
      - /srv/haltewecker/secrets/canada-metrolink/.env
      - /srv/haltewecker/secrets/usa_511/.env
    build:
      context: ..
      dockerfile: services/static-departures.Dockerfile
    container_name: ${STATIC_DEPARTURES_CONTAINER_NAME:-static-departures-api}
    environment:
      DEPARTURES_DATABASE: ${DEPARTURES_DATABASE:-/data/current-release/departures.sqlite}
      STATIC_DATA_ROOT: ${STATIC_DATA_ROOT:-/data/current-release/stop-data}
      IRELAND_REALTIME_ROOT: ${IRELAND_REALTIME_ROOT:-/data/ireland/realtime}
      PORT: "8080"
    volumes:
      - /srv/haltewecker/data/releases:/data/releases:ro
      - /srv/haltewecker/data/current:/data/current:ro
      - /srv/haltewecker/data/current-release:/data/current-release:ro
      - /srv/haltewecker/data/departures-current.sqlite:/data/departures-current.sqlite:ro
      - /srv/haltewecker/data/ireland/realtime:/data/ireland/realtime:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - haltewecker

networks:
  haltewecker:
    external: true
